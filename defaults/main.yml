---
## Provided by Playbook

proxmox_api_host: ""
# Host used for the API connection / TLS verification. Defaults to the node
# name; override with the FQDN when the API certificate uses one.
proxmox_api_endpoint: "{{ proxmox_api_host }}"
proxmox_api_user: ""
proxmox_api_password: ""
proxmox_network_lan: ""
proxmox_network_san: ""
virtual_machine_cores: 2
virtual_machine_id: auto
virtual_machine_password: debian
virtual_machine_user: debian
virtual_machine_name: testvm
virtual_machine_memory: 2048

## Other, may be overridden in Playbook

# Seconds to wait for the create task (disk import) before the module gives up.
virtual_machine_create_timeout: 300
proxmox_bios: ovmf    # seabios
proxmox_cpu_type: x86-64-v3
# VLAN arriving untagged (the native/PVID VLAN) on the node's bridge. A network
# whose tag matches gets a NIC with no tag=, because PVE rejects tag=0 and
# switches typically drop frames tagged with the native VLAN ID. 0 disables it.
proxmox_untagged_vlan: 0
proxmox_volume_group: mpio
virtual_machine_disk: scsi0
virtual_machine_disk_file: debian-13-genericcloud-amd64.qcow2
# Target format of the imported OS disk. qcow2 permits snapshots on file-based
# storage such as NFS; LVM-backed storage only supports raw.
virtual_machine_disk_format: qcow2
# Absolute size of the OS disk, with a KMGT suffix. Being absolute rather than
# an increment, it does not drift as the cloud image grows. Proxmox cannot
# shrink a disk, so a value below the image size fails the resize task.
virtual_machine_disk_size: 30G
# Tells the guest its OS disk is solid-state. Only true when the volume group
# is on SSD; claiming it for HDD-backed storage misleads the guest's I/O
# scheduler. Discard is always on, so guest trims free space on thin storage.
virtual_machine_disk_ssd: false
virtual_machine_disk_url: "https://cloud.debian.org/images/cloud/trixie/latest/{{ virtual_machine_disk_file }}"
virtual_machine_expand_disk: true
virtual_machine_nameserver: "{{ networks[proxmox_network_lan].dnsservers | split(' ') }}"
virtual_machine_os: l26
virtual_machine_searchdomain: "{{ networks[proxmox_network_lan].searchdomain | split(' ') }}"
# Public key handed to cloud-init, resolved on the control node. Override in
# group_vars or host_vars to keep keys elsewhere; a relative path is taken from
# the playbook directory. A missing file means the VM is created with no key.
virtual_machine_ssh_key_file: "~/.ssh/{{ virtual_machine_name }}.key.pub"
virtual_machine_start: true

## Computed Values

config_ip4: >-
  {{ virtual_machine_ip4 + '/' + networks[proxmox_network_lan].ip4_netmask | string + ',gw='
  + networks[proxmox_network_lan].ip4_gateway }}
config_ip6: >-
  ,ip6={{ virtual_machine_ip6 }}/{{ networks[proxmox_network_lan].ip6_netmask | string }},
  gw6={{ networks[proxmox_network_lan].ip6_gateway }}
config_san: "ip={{ virtual_machine_san }}/{{ san_netmask }}"
lan_tag: >-
  {{ 0 if networks[proxmox_network_lan].tag | int == proxmox_untagged_vlan | int
  else networks[proxmox_network_lan].tag | int }}
# discard=on passes guest trims through to LVM-thin or a qcow2 on NFS, which
# returns the space; without it, deleted data stays allocated on the storage.
disk_options: "discard=on{{ ',ssd=1' if virtual_machine_disk_ssd | bool else '' }}"
efidisk:
  efitype: 4m
  format: "{{ virtual_machine_disk_format }}"
  pre_enrolled_keys: true
  storage: "{{ proxmox_volume_group }}"
san_netmask: "{{ networks[proxmox_network_san].ip4_netmask | default('') | string }}"
san_prefix: "{{ networks[proxmox_network_san].ip4_prefix | default('') }}"
ssh_keys: >-
  {{ lookup('ansible.builtin.file', virtual_machine_ssh_key_file, errors='ignore')
  | default('', true) | trim }}
virtual_machine_hex: "{{ '%04x' | format((virtual_machine_int | int * virtual_machine_int | int) | int) }}"
virtual_machine_int: "{{ 1 if virtual_machine_id == 'auto' else (virtual_machine_id | string)[-3:] | int }}"
virtual_machine_ip4: "{{ networks[proxmox_network_lan].ip4_prefix }}.{{ virtual_machine_int }}"
virtual_machine_ip6: >-
  {{ '' if not networks[proxmox_network_lan].ip6 else networks[proxmox_network_lan].ip6_prefix
    + '::' + virtual_machine_hex }}
virtual_machine_san: "{{ san_prefix + '.' + (virtual_machine_int | string) if san_prefix | length > 0 else '' }}"
vmbr_net0: >-
  {{ 'virtio,bridge=vmbr' + networks[proxmox_network_lan].vmbr | string
  + (',tag=' + lan_tag | string if lan_tag | int > 0 else '') }}
vmbr_net1: >-
  {{ 'virtio,bridge=vmbr' + networks[proxmox_network_san].vmbr | string if virtual_machine_san | length > 0 else '' }}
